name: Deploy scripts wiki

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate inventory.json from script headers
        run: python3 docs/generate_inventory.py

      - name: Fail if inventory.json is stale
        run: |
          if ! git diff --quiet -- docs/inventory.json; then
            echo "::error::docs/inventory.json is out of date with the script headers."
            echo "Run 'python3 docs/generate_inventory.py' and commit the result"
            echo "(the pre-commit hook does this automatically — see docs/HOOKS.md)."
            git diff -- docs/inventory.json
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
